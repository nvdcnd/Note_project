<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yêu cầu theme</title><link rel="stylesheet" href="ui.css"></head><body><main class="page" style="max-width:760px"><a class="button secondary" href="theme-store.html">← Về Theme store</a><section class="form-card" style="margin-top:24px"><span class="badge">Theme brief</span><h1>Yêu cầu một theme mới</h1><p class="muted">Mô tả mục tiêu thay vì chỉ màu sắc, để theme vẫn đọc tốt và dùng được trên mọi thiết bị.</p><form><div class="field"><label for="name">Tên theme</label><input id="name" placeholder="Ví dụ: Calm Studio"></div><div class="field"><label for="scope">Phạm vi</label><select id="scope"><option>Personal</option><option>Organization</option></select></div><div class="field"><label for="style">Style brief</label><textarea id="style" placeholder="Mood, màu, typography, các thành phần cần ưu tiên…"></textarea></div><div class="field"><label for="drag">Kiểu thao tác chính</label><select id="drag"><option>Vuốt ngang: để sau / hoàn thành</option><option>Vuốt dọc: chuyển / hoàn thành</option></select></div><div class="field"><label for="budget">Ngân sách dự kiến (xu)</label><input id="budget" type="number" min="0" placeholder="0"></div><button class="primary" type="button">Gửi yêu cầu</button></form></section></main></body></html>
