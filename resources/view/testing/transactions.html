<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chuyển tiền</title><link rel="stylesheet" href="ui.css"></head><body><main class="page" style="max-width:760px"><a class="button secondary" href="wallet.html">← Về ví</a><section class="form-card" style="margin-top:24px"><span class="badge">Bước 1/2</span><h1>Chuyển tiền an toàn</h1><p class="muted">Bạn sẽ xem lại thông tin và xác thực OTP trước khi giao dịch hoàn tất.</p><form><div class="field"><label for="recipient">Email người nhận</label><input id="recipient" type="email" placeholder="ban@example.com"></div><div class="field"><label for="amount">Số xu</label><input id="amount" type="number" min="1" placeholder="0"></div><div class="field"><label for="message">Lời nhắn (không bắt buộc)</label><textarea id="message" placeholder="Ví dụ: Chia phí theme team"></textarea></div><button class="primary" type="button">Tiếp tục xác nhận</button></form></section><section class="panel" style="margin-top:18px"><strong>Lưu ý</strong><p class="muted">Prototype không xử lý tiền thật. Khi tích hợp, tổng tiền, người nhận và thời hạn OTP phải được lấy lại từ server ở bước xác nhận.</p></section></main></body></html>
