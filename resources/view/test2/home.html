<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
<title>Document</title> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<style>
    body {
        font-family: 'Caveat', cursive;
        width: 100%;
        height: 100vh;
        background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20240613/pngtree-corkboard-or-pinboard-or-bulletin-board-cork-background-in-wide-banner-image_15749733.jpg');
        background-size: cover;
        background-position: center;
        backdrop-filter: blur(2px);
        --webkit-backdrop-filter: blur(2px);
    }
    .sidebar {
        /*background-image:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSsZNyeNEfP6yyYHyRkGwlGoNcD5R0KeEXZpHk4zt4dqux2k1jajMs-ugjG&s=10');*/
        background: rgba(255, 255, 255, 0.35);
        background-size: cover;
        /*background-color: rgba(0, 0, 0, 0.5);*/
        backdrop-filter: blur(12px) brightness(0.8);
        --webkit-backdrop-filter: blur(12px);/* 3. Viền mảnh bán trong suốt tạo cảm giác mép kính */
        border-right: 1px solid rgba(255, 255, 255, 0.3);

        /* 4. Đổ bóng nhẹ để tách khỏi nền */
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        height: 80vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 20px;
        height: 100vh;
    }
    .sidebar-container {
        position: sticky;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding:20px;
        top: 0;
    }
    .sidebar ul {
        list-style-type: none;
        padding: 10px;
        color: #fff;
    }
    .sidebar ul li i{
        display:block;
        margin-right: 10px;
    }
    .sidebar ul li {
        margin-bottom: 30px;
    }
    .sidebar ul li a {
        text-decoration: none;
        color: #000;
        font-family: 'Caveat', cursive;
        font-size: 1.2rem;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding: 10px;
    }
    .sidebar ul li a:hover {
        background-color: #FFC0CB;
        clip-path: polygon(0% 0%, 85% 0%, 100% 50%, 85% 100%, 0% 100%);
        border-radius: 5px;
        width: 200px;
        color: #000;
    }
    .topbar {
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .drop{
        border: 3px solid #FACC15;
        width: 200px;
        font-size: 1.2rem;
        background: rgba(255, 255, 255, 0.35);
    }
    .drop:hover{
        background-color: #FACC15;
        color: #000;
    }
    .drop:focus{
        background-color: #FACC15;
        color: #000;
    }
    .btn-primary {
            background-color: #FACC15;
            border-color: #FACC15;
            color: #000;
    }
    .btn-primary:hover {
            background-color: #EAB308;
            border-color: #EAB308;
    }
    .btn-primary:focus {
            box-shadow: 0 0 0 0.2rem rgba(250, 204, 21, 0.5);
            background-color: #EAB308;
            border-color: #EAB308;
    }
    .btn-primary:disabled {
            background-color: #FACC15;
            border-color: #FACC15;
            color: #000;
    }
    .btn-primary:disabled:hover {
            background-color: #FACC15;
            border-color: #FACC15;
            color: #000;
    }
    .content {
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 80vh;
    }
    .card {
        border: none;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        width: 350px;
        height: 350px;
        font-size: 1.2rem;
    }
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .content .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
    }
    @media (max-width: 768px) {
        .widescreen-only {
            display: none;
        }
    }
    .bigform {
        resize: none;
    }
    .form-control {
            background-color: transparent;
            border:none;
            border-bottom: 2px solid #000;
            outline: none;
        }
        .form-control:focus {
            background-color: transparent;
            outline: none;
        }
        .form-label {
            font-size: 1.2rem;
        }
</style>
</head>
<body>
    <section class="widescreen-only">
        <div class="row">
        <div class="col-lg-2">
            <div class="sidebar">
                <div class="sidebar-header">
                        <h2 class="text-center" style="color: #000;font-family: 'Caveat', cursive;font-size: 2rem;font-weight: bold;">Noteket</h2>
                    </div>
                <div class="sidebar-container">
                    <ul>
                        <li><a href="#"><i class="fas fa-home"></i> Home</a></li>
                        <li><a href="#"><i class="fas fa-info-circle"></i> Teams</a></li>
                        <li><a href="#"><i class="fas fa-cogs"></i> Theme</a></li>
                        <li><a href="#"><i class="fas fa-envelope"></i> Balanced</a></li>
                        <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
                    </ul>
                    <div class="sidebar-footer">
                        <p class="text-center" style="color: #000;font-family: 'Caveat', cursive;">&copy; 2026 Noteket</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg">
            <section class="top">
                <div class="topbar">
                <div class="topbar-left">
                    <!-- Left side content -->
                </div>
                <div class="topbar-container">
                    <div class="dropdown">
                        <a class="btn drop dropdown-toggle rounded-pill" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Dropdown link
                        </a>

                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </div>
                </div>
                <div class="topbar-right" style="display: flex; align-items: center;">
                    <button class="btn btn-primary rounded-pill" style="margin-right: 10px; padding: 10px 20px; font-size: 1.2rem;font-weight: bold;" disabled>
                        $300
                    </button>
                    <button class="btn btn-primary rounded-circle" style="width: 50px; height: 50px; padding: 0; display: flex; align-items: center; justify-content: center;">
                        <image src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQMZjYeTW5dVKQpVxWLdjUqQTgjkSBVfVzONaCzFqnpig&s" style="width: 40px; height: 40px;" alt="Profile" class="rounded-circle">
                    </button>
            </div>
            </section>
            <section class="content">
                <div class="container">
                    <div class="row">
                        <div class="col-lg">
                            <div class="card">
                                 <div class="card-header" style="background-color: #FACC15;padding: 7px;display: flex;justify-content: center;align-items: center;">
                                    <p>Create Note</p>
                                </div>
                                <div class="card-body rounded" style="background-color: #FFE86E;padding: 20px;">
                                    <form action="/create/note" method="POST">
                                        <div class="mb-3">
                                            <label for="noteTitle" class="form-label">Note Title</label>
                                            <input type="text" class="form-control" id="noteTitle" name="noteTitle" required>
                                        </div>
                                        <div class="mb-3">
                                            <label for="noteContent" class="form-label">Note Content</label>
                                            <textarea class="form-control bigform" id="noteContent" name="noteContent" rows="2.5" required></textarea>
                                        </div>
                                        <button type="submit" class="btn btn-primary w-100">Create Note</button>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg">
                            <div class="card">
                                <div class="card-header" style="background-color: #FACC15;padding: 7px;display: flex;justify-content: center;align-items: center;">
                                    <p>Created at: 2023-10-01 06:50:00</p>
                                </div>
                                <div class="card-body rounded" style="background-color: #FFE86E;padding: 20px;">
                                    <h3 class="card-title">Note title</h3>
                                    <p class="card-text">This is the card body content.</p>
                                    <p class="card-text text-secondary">By: John Doe</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
        </div>
    </div>
    </section>
     <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</body>
</html>
