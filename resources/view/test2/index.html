<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Caveat', cursive;
            width: 100%;
            height: 100vh;
            background-image: url('https://img.magnific.com/premium-vector/bulletin-board_689076-482.jpg?semt=ais_hybrid&w=740&q=80');
            background-size: cover;
            background-position: center;
            backdrop-filter: blur(2px);
            --webkit-backdrop-filter: blur(2px);
        }
        .card {
            border: none;
        }
        .card-title {
            font-size: 5rem;
            font-weight: bold;
        }
        label {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #FACC15;
            border-color: #FACC15;
            color: #000;
        }
        .btn-primary:hover {
            background-color: #EAB308;
            border-color: #EAB308;
        }
        .btn-primary:focus {
            box-shadow: 0 0 0 0.2rem rgba(250, 204, 21, 0.5);
            background-color: #EAB308;
            border-color: #EAB308;
        }
        .card-text{
            font-size: 1.4rem;
        }
        input[type="email"], input[type="password"] {
            font-size: 1.2rem;
        }
        .form-control {
            background-color: transparent;
            border:none;
            border-bottom: 2px solid #000;
            outline: none;
        }
        .form-control:focus {
            background-color: transparent;
            outline: none;
        }
        .form-label {
            font-size: 1.2rem;
        }
        @media (min-width: 576px) and (max-width: 768px) {
            .card-title {
                font-size: 4rem;
            }
            .card-text {
                font-size: 1.2rem;
            }
            label {
                font-size: 1rem;
            }
            input[type="email"], input[type="password"] {
                font-size: 1rem;
            }
            .mobile-line {
                display: none;
            }
        }
        @media (max-width: 576px) {
            .card-title {
                font-size: 3rem;
            }
            .card-text {
                font-size: 1.2rem;
            }
            label {
                font-size: 1rem;
            }
            input[type="email"], input[type="password"] {
                font-size: 1rem;
            }
            .mobile-line {
                display: block;
                margin: 20px 0;
            }
        }
        .modal-body {
            background-color: #FFE86E;
            font-size: 1.2rem;
        }
        .modal-header {
            background-color: #FACC15;
        }
        .form-check-label {
            background-color: transparent;
            border: none;
            outline: none;
            font-size: 1.2rem;
        }
        .form-check-input {
            background-color: transparent;
            border: #000 solid 2px;
            border-radius: 50px;
            outline: none;
            margin-top:6px;
        }
        .form-check-input:focus {
            background-color: black;
            outline: none;
            color: #FACC15;
        }
        /* Empty state: hiển thị khi danh sách không có dữ liệu (bỏ class để hiện) */
    .empty-state { display: none; }
</style>
</head>
