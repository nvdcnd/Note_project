
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification</title>
  <style>
    body { margin: 0; min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(180deg, #fef8e8 0%, #efe1ca 100%); color: #3d3025; display: grid; place-items: center; padding: 1rem; }
    .card { width: min(520px, 100%); background: #fff9ee; border-radius: 28px; border: 1px solid rgba(139, 101, 44, 0.18); box-shadow: 0 22px 40px rgba(75, 48, 20, 0.15); padding: 2rem; }
    .card h1 { margin: 0 0 1rem; font-size: 1.6rem; }
    .form-group { display: grid; gap: 1rem; }
    input { width: 100%; border-radius: 18px; border: 1px solid rgba(156, 108, 35, 0.2); padding: 1rem; background: #fff8e2; }
    button { width: 100%; border: none; border-radius: 18px; padding: 1rem; background: linear-gradient(180deg, #d28a29, #b05f18); color: white; font-weight: 700; }
  </style>
</head>
<body>
  <article class="card">
    <h1>Nhập OTP cho Xác thực</h1>
    <form class="form-group">
      <input type="text" placeholder="Nhập mã OTP" maxlength="6">
      <button type="submit">Xác nhận</button>
    </form>
  </article>
</body>
</html>
