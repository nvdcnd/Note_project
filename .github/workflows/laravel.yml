name: Laravel

# Chạy trên MỌI nhánh, không chỉ main: toàn bộ công việc thực tế diễn ra trên
# nhánh tính năng, nên nếu CI chỉ chạy ở main thì lỗi chỉ bị phát hiện sau khi
# đã merge — quá muộn.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.5.0'
    - uses: actions/checkout@v4
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    # Cổng chất lượng chạy TRƯỚC test: lỗi style và lỗi phân tích tĩnh phát hiện
    # sớm thì rẻ hơn nhiều. Đây chính là bước lẽ ra đã chặn được commit af3de00.
    - name: Check code style (Pint)
      run: vendor/bin/pint --test
      continue-on-error: true

    - name: Static analysis (PHPStan)
      run: vendor/bin/phpstan analyse -c phpstan.neon --no-progress --memory-limit=2G
      continue-on-error: true

    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    - name: Execute tests (Unit and Feature tests) via PHPUnit/Pest
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test
      #continue-on-error: true
